<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The four roles add up</title><desc id="d">Each role includes everything the previous one can do and adds more: Viewer reads; Operator acknowledges alarms and sends commands; Manager edits synoptics, dashboards, documents and alarm settings; Administrator also manages users, subscriptions and company settings.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b1e"/><stop offset="1" stop-color="#10262a"/></linearGradient>
<style>.h{fill:#e6f4f1;font-size:17px;font-weight:600}.s{fill:#8fb3ae;font-size:13px}.r{fill:#0d1b1e;font-size:14px;font-weight:700}.c{fill:#e6f4f1;font-size:14px}</style></defs>
<rect width="960" height="400" rx="16" fill="url(#bg)"/>
<text class="h" x="40" y="44">Each role = the previous one + its rights</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.5s" fill="freeze"/><rect x="40" y="80" width="470" height="56" rx="10" fill="#3b6f78"/><text class="r" x="58" y="104">Viewer</text><text class="r" style="font-weight:400" x="58" y="124">Reads measures, alarms, dashboards, documents</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.5s" fill="freeze"/><rect x="40" y="154" width="600" height="56" rx="10" fill="#2fa38f"/><text class="r" x="58" y="178">Operator</text><text class="r" style="font-weight:400" x="58" y="198">Acknowledges alarms, sends commands</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.8s" dur="0.5s" fill="freeze"/><rect x="40" y="228" width="730" height="56" rx="10" fill="#7ff0da"/><text class="r" x="58" y="252">Manager</text><text class="r" style="font-weight:400" x="58" y="272">Edits synoptics, dashboards, documents, alarms</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="5.4s" dur="0.5s" fill="freeze"/><rect x="40" y="302" width="860" height="56" rx="10" fill="#f4c06a"/><text class="r" x="58" y="326">Administrator</text><text class="r" style="font-weight:400" x="58" y="346">Users, subscriptions, company</text></g>
</svg>
